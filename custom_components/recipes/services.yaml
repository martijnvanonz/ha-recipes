save:
  fields:
    id:
      selector:
        text:
    title:
      example: "Taco wraps"
      selector:
        text:
    servings:
      example: 2
      selector:
        number:
          min: 1
          max: 50
          mode: box
    ingredients:
      example: '[{"amount": "300", "unit": "g", "name": "minced beef"}, {"amount": "1", "name": "red onion"}]'
      selector:
        object:
    steps:
      example: "Chop the onion.\nFry the beef."
      selector:
        text:
          multiline: true
    photo_url:
      selector:
        text:
          type: url
    photo_base64:
      selector:
        text:
          multiline: true
    remove_photo:
      selector:
        boolean:
    cooked_count:
      selector:
        number:
          min: 0
          max: 1000
          mode: box
    last_cooked:
      selector:
        date:
    time_minutes:
      example: 30
      selector:
        number:
          min: 0
          max: 1440
          unit_of_measurement: min
          mode: box
    favorite:
      selector:
        boolean:
delete:
  fields:
    id:
      required: true
      selector:
        text:
list:
