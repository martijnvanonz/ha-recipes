name: Bug report
description: Something does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Recipes version
      placeholder: "0.7.1"
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.10.1"
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does it happen?
      options:
        - Recipes tab (desktop browser)
        - Recipes tab (phone or Companion app)
        - A service / automation
        - Setup or settings
        - Somewhere else
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Errors from Settings → System → Logs that mention `recipes`, or from the browser console.
      render: text
